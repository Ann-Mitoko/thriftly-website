openapi: 3.0.0
info:
  title: Thriftly API
  description: 'API exposed by Thriftly (Team 4) for consumption by Team 5 (BillingSys_React). Covers
    vendor and product listing lookups for supplier/expense onboarding, and purchase confirmation for
    completed stock purchases.

    '
  version: 1.0.0
  license:
    name: MIT
servers:
- url: http://localhost:5000
  description: Local development server
paths:
  /vendors:
    get:
      summary: Return all verified vendor profiles
      operationId: listVendors
      responses:
        '200':
          description: A list of verified vendor profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
              example:
              - id: 1
                name: Mama Njeri's Closet
                category: Vintage
                market: Gikomba Market
                description: Over 200 curated vintage pieces, hand-picked and quality-checked before listing.
                  Specialises in 80s and 90s women's wear.
                phone: '+254712345678'
                email: mamanjeri@example.com
                verified: true
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
  /vendors/{id}:
    get:
      summary: Return a single vendor's full profile by ID
      operationId: getVendorById
      parameters:
      - name: id
        in: path
        required: true
        description: Unique vendor identifier
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: The requested vendor's full profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
              example:
                id: 1
                name: Mama Njeri's Closet
                category: Vintage
                market: Gikomba Market
                description: Over 200 curated vintage pieces, hand-picked and quality-checked before listing.
                  Specialises in 80s and 90s women's wear.
                phone: '+254712345678'
                email: mamanjeri@example.com
                verified: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
      description: Returns a verified vendor. A vendor that is not verified is treated as not found (404).
    put:
      summary: Update a vendor's profile
      operationId: updateVendor
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdateRequest'
            example:
              name: Mama Njeri's Closet
              category: Vintage
              market: Gikomba Market
              description: Over 200 curated vintage pieces, hand-picked and quality-checked before listing.
                Specialises in 80s and 90s women's wear.
              phone: '+254712345678'
              email: mamanjeri@example.com
              verified: true
      responses:
        '200':
          description: The updated vendor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400':
          description: Request body is missing required fields or has an invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: NOT YET IMPLEMENTED in v1.0.0 — this endpoint is part of the planned contract only.
        Calling it currently returns 404.
    delete:
      summary: Delete a vendor
      operationId: deleteVendor
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '204':
          description: Vendor deleted successfully, no content returned
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: NOT YET IMPLEMENTED in v1.0.0 — this endpoint is part of the planned contract only.
        Calling it currently returns 404.
  /products:
    get:
      summary: Return active product listings
      operationId: listProducts
      parameters:
      - name: vendorId
        in: query
        required: false
        description: Filter listings to a single vendor
        schema:
          type: integer
          example: 1
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - Vintage
          - Streetwear
          - Kids
          - Accessories
          - Bulk
          example: Streetwear
      responses:
        '200':
          description: A list of active product listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
              - id: 1
                vendorId: 1
                name: Denim Jacket, Size M
                category: Vintage
                brand: Levi's
                price: 750
                currency: KES
                quantityAvailable: 3
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
  /products/{id}:
    get:
      summary: Return a single product listing's full details by ID
      operationId: getProductById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: The requested product listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                vendorId: 1
                name: Denim Jacket, Size M
                category: Vintage
                brand: Levi's
                price: 750
                currency: KES
                quantityAvailable: 3
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
    put:
      summary: Update a product listing
      operationId: updateProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              name: Denim Jacket, Size M
              category: Vintage
              brand: Levi's
              price: 750
              currency: KES
              quantityAvailable: 3
      responses:
        '200':
          description: The updated product listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Request body is missing required fields or has an invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: NOT YET IMPLEMENTED in v1.0.0 — this endpoint is part of the planned contract only.
        Calling it currently returns 404.
    delete:
      summary: Delete a product listing
      operationId: deleteProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '204':
          description: Product deleted successfully, no content returned
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: NOT YET IMPLEMENTED in v1.0.0 — this endpoint is part of the planned contract only.
        Calling it currently returns 404.
  /purchases:
    post:
      summary: Create a purchase confirmation for a completed stock purchase
      operationId: createPurchase
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
            example:
              vendorId: 5
              productId: 9
              quantity: 1
              totalAmount: 1800
              currency: KES
      responses:
        '201':
          description: Purchase confirmed and recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseConfirmation'
              example:
                id: '1'
                referenceNumber: THR-PC-8F8F3C94
                vendorId: 5
                productId: 9
                quantity: 1
                totalAmount: 1800
                currency: KES
                status: confirmed
                createdAt: '2026-10-12T06:29:23Z'
        '400':
          description: Missing/invalid field (vendorId, productId, quantity, totalAmount, currency), totalAmount
            not equal to price x quantity, or quantity exceeds available stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: quantity must be a positive integer
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
                message: Bearer token missing or expired
        '404':
          description: No vendor with that vendorId, or no product with that productId belonging to that
            vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: No vendor found with the given vendorId
        '500':
          $ref: '#/components/responses/ServerError'
      description: 'Records a confirmed stock purchase and reduces the product''s available stock by the
        purchased quantity. The product must belong to the given vendor, and `totalAmount` must equal
        the product''s price x `quantity`. The purchase and the stock change succeed or fail together,
        and stock can never go below zero. Requires the header `Authorization: Bearer thriftly-dev-token-2026`
        (placeholder token until real auth is built).'
    get:
      summary: List past purchases, newest first
      description: 'Returns purchase history so a consumer can analyse trends. Each record includes the
        product''s current name and brand (not a snapshot from the time of purchase). All filters are
        optional and combine with AND. Requires the header `Authorization: Bearer thriftly-dev-token-2026`
        (placeholder token).'
      operationId: listPurchases
      security:
      - bearerAuth: []
      parameters:
      - name: vendorId
        in: query
        required: false
        description: Only purchases from this vendor
        schema:
          type: integer
          example: 1
      - name: productId
        in: query
        required: false
        description: Only purchases of this product
        schema:
          type: integer
          example: 1
      - name: from
        in: query
        required: false
        description: Only purchases at or after this moment
        schema:
          type: string
          format: date-time
          example: '2026-10-01T00:00:00Z'
      - name: to
        in: query
        required: false
        description: Only purchases at or before this moment
        schema:
          type: string
          format: date-time
          example: '2026-10-31T23:59:59Z'
      responses:
        '200':
          description: Matching purchases (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseRecord'
              example:
              - id: '2'
                referenceNumber: THR-PC-8F8F3C94
                vendorId: 1
                productId: 1
                productName: Denim Jacket, Size M
                brand: Levi's
                quantity: 2
                unitPrice: 750
                totalAmount: 1500
                currency: KES
                status: confirmed
                createdAt: '2026-10-12T06:29:23.679Z'
              - id: '1'
                referenceNumber: THR-PC-E46C3697
                vendorId: 5
                productId: 9
                productName: Charcoal Blazer, Size 42
                brand: null
                quantity: 1
                unitPrice: 1800
                totalAmount: 1800
                currency: KES
                status: confirmed
                createdAt: '2026-10-12T06:30:53.559Z'
        '400':
          description: vendorId must be an integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: vendorId must be an integer
        '401':
          description: Bearer token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
                message: Bearer token missing or invalid
        '500':
          $ref: '#/components/responses/ServerError'
  /purchases/{id}:
    get:
      summary: Look up a purchase confirmation by ID
      operationId: getPurchaseById
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: '1'
      responses:
        '200':
          description: The requested purchase confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseConfirmation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: NOT YET IMPLEMENTED in v1.0.0 — this endpoint is part of the planned contract only.
        Calling it currently returns 404.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Vendor:
      type: object
      required:
      - id
      - name
      - category
      - market
      - description
      - verified
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Mama Njeri's Closet
        category:
          type: string
          enum:
          - Vintage
          - Streetwear
          - Kids
          - Accessories
          - Bulk
          example: Vintage
        market:
          type: string
          example: Gikomba Market
        phone:
          type: string
          example: '+254712345678'
        email:
          type: string
          format: email
          example: mamanjeri@example.com
        verified:
          type: boolean
          example: true
          description: 'Always true: only verified vendors are ever returned.'
        description:
          type: string
          nullable: true
          description: Free-text description of the vendor, including what they specialise in.
          example: Over 200 curated vintage pieces, hand-picked and quality-checked before listing. Specialises
            in 80s and 90s women's wear.
    VendorUpdateRequest:
      type: object
      required:
      - name
      - category
      - market
      - phone
      - email
      - verified
      properties:
        name:
          type: string
          example: Mama Njeri's Closet
        category:
          type: string
          enum:
          - Vintage
          - Streetwear
          - Kids
          - Accessories
          - Bulk
          example: Vintage
        market:
          type: string
          example: Gikomba Market
        phone:
          type: string
          example: '+254712345678'
        email:
          type: string
          format: email
          example: mamanjeri@example.com
        verified:
          type: boolean
          example: true
        description:
          type: string
          nullable: true
          example: Over 200 curated vintage pieces, hand-picked and quality-checked before listing. Specialises
            in 80s and 90s women's wear.
    ProductUpdateRequest:
      type: object
      required:
      - name
      - category
      - price
      - currency
      - quantityAvailable
      properties:
        name:
          type: string
          example: Denim Jacket, Size M
        category:
          type: string
          enum:
          - Vintage
          - Streetwear
          - Kids
          - Accessories
          - Bulk
          example: Vintage
        price:
          type: number
          format: float
          example: 750
        currency:
          type: string
          example: KES
        quantityAvailable:
          type: integer
          example: 3
        brand:
          type: string
          nullable: true
          example: Levi's
    Product:
      type: object
      required:
      - id
      - vendorId
      - name
      - category
      - brand
      - price
      - currency
      - quantityAvailable
      properties:
        id:
          type: integer
          example: 1
        vendorId:
          type: integer
          example: 1
        name:
          type: string
          example: Denim Jacket, Size M
        category:
          type: string
          enum:
          - Vintage
          - Streetwear
          - Kids
          - Accessories
          - Bulk
          example: Vintage
        price:
          type: number
          format: float
          example: 750
        currency:
          type: string
          example: KES
        quantityAvailable:
          type: integer
          example: 3
        brand:
          type: string
          nullable: true
          description: Brand of the item, or null when the item is unbranded.
          example: Levi's
    PurchaseRequest:
      type: object
      required:
      - vendorId
      - productId
      - quantity
      - totalAmount
      - currency
      properties:
        vendorId:
          type: integer
          example: 5
        productId:
          type: integer
          example: 9
        quantity:
          type: integer
          minimum: 1
          example: 1
        totalAmount:
          type: number
          format: float
          example: 1800
          description: Must equal the product's price multiplied by quantity.
        currency:
          type: string
          example: KES
    PurchaseConfirmation:
      type: object
      required:
      - id
      - referenceNumber
      - vendorId
      - productId
      - quantity
      - totalAmount
      - currency
      - status
      - createdAt
      properties:
        id:
          type: string
          example: '1'
        referenceNumber:
          type: string
          example: THR-PC-8F8F3C94
        vendorId:
          type: integer
          example: 5
        productId:
          type: integer
          example: 9
        quantity:
          type: integer
          example: 1
        totalAmount:
          type: number
          format: float
          example: 1800
        currency:
          type: string
          example: KES
        status:
          type: string
          enum:
          - confirmed
          - failed
          example: confirmed
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T06:29:23Z'
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: invalid_request
        message:
          type: string
          example: quantity must be a positive integer
    PurchaseRecord:
      type: object
      required:
      - id
      - referenceNumber
      - vendorId
      - productId
      - productName
      - brand
      - quantity
      - unitPrice
      - totalAmount
      - currency
      - status
      - createdAt
      properties:
        id:
          type: string
          example: '2'
        referenceNumber:
          type: string
          example: THR-PC-8F8F3C94
        vendorId:
          type: integer
          example: 1
        productId:
          type: integer
          example: 1
        productName:
          type: string
          description: The product's current name.
          example: Denim Jacket, Size M
        brand:
          type: string
          nullable: true
          description: The product's current brand, or null if unbranded.
          example: Levi's
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: float
          description: totalAmount divided by quantity, rounded to 2 decimals.
          example: 750
        totalAmount:
          type: number
          format: float
          example: 1500
        currency:
          type: string
          example: KES
        status:
          type: string
          enum:
          - confirmed
          - failed
          example: confirmed
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T06:29:23.679Z'
  responses:
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No vendor found with the given id
    ServerError:
      description: An unexpected error occurred on the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: server_error
            message: Something went wrong. Please try again.
