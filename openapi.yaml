        totalAmount:
          type: number
          format: float
          example: 2400
        currency:
          type: string
          example: "KES"
        status:
          type: string
          enum: [confirmed, failed]
          example: "confirmed"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-06T14:22:00Z"

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: "invalid_request"
        message:
          type: string
          example: "quantity must be a positive integer"

  responses:
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "not_found"
            message: "No vendor found with the given id"
    ServerError:
      description: An unexpected error occurred on the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "server_error"
            message: "Something went wrong. Please try again."