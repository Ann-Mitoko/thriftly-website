>>>>>>> e361f1de6a73eea4050dcaf755f374934e8fd33b
            example: Streetwear
      responses:
        '200':
          description: A list of active product listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - id: "p_5581"
                  vendorId: "v_2291"
                  name: "Denim Jacket, Size M"
                  category: "Vintage"
                  price: 1200
                  currency: "KES"
                  quantityAvailable: 3
        '500':
          $ref: '#/components/responses/ServerError'

  /products/{id}:
    get:
      summary: Return a single product listing's full details by ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "p_5581"
      responses:
        '200':
          description: The requested product listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: "p_5581"
                vendorId: "v_2291"
                name: "Denim Jacket, Size M"
                category: "Vintage"
                price: 1200
                currency: "KES"
                quantityAvailable: 3
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /purchases:
    post:
      summary: Create a purchase confirmation for a completed stock purchase
      operationId: createPurchase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
            example:
              vendorId: "v_2291"
              productId: "p_5581"
              quantity: 2
              totalAmount: 2400
              currency: "KES"
      responses:
        '201':
          description: Purchase confirmed and recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseConfirmation'
              example:
                id: "pc_9931"
                referenceNumber: "THR-PC-99310"
                vendorId: "v_2291"
                productId: "p_5581"
                quantity: 2
                totalAmount: 2400
                currency: "KES"
                status: "confirmed"
                createdAt: "2026-09-06T14:22:00Z"
        '400':
          description: Request body is missing required fields or has an invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "invalid_request"
                message: "quantity must be a positive integer"
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "unauthorized"
                message: "Bearer token missing or expired"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

