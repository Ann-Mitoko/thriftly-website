openapi: 3.0.0
info:
  title: Thriftly API
  version: 1.0.0

paths:
  /vendors:
    get:
      summary: Return all verified vendor profiles
      operationId: listVendors
      parameters:
        - name: category
          in: query
          required: false
          description: Filter vendors by product category
          schema:
            type: string
            enum: [Vintage, Streetwear, Kids, Accessories, Bulk]
            example: Vintage
        - name: market
          in: query
          required: false
          description: Filter vendors by physical market location
          schema:
            type: string
            example: Gikomba
      responses:
        '200':
          description: A list of verified vendor profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendor'
              example:
                - id: "v_2291"
                  name: "Mama Njeri Thrift"
                  category: "Vintage"
                  market: "Gikomba"
                  phone: "+254712345678"
                  email: "mamanjeri@thriftly.co.ke"
                  verified: true
        '500':
          $ref: '#/components/responses/ServerError'

  /vendors/{id}:
    get:
      summary: Return a single vendor's full profile by ID
      operationId: getVendorById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique vendor identifier
          schema:
            type: string
            example: "v_2291"
      responses:
        '200':
          description: The requested vendor's full profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
              example:
                id: "v_2291"
                name: "Mama Njeri Thrift"
                category: "Vintage"
                market: "Gikomba"
                phone: "+254712345678"
                email: "mamanjeri@thriftly.co.ke"
                verified: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /products:
    get:
      summary: Return active product listings
      operationId: listProducts
      parameters:
        - name: vendorId
          in: query
          required: false
          description: Filter listings to a single vendor
          schema:
            type: string
            example: "v_2291"
        - name: category
          in: query
          required: false
          schema:
            type: string
<<<<<<< HEAD
